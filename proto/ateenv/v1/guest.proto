// Minimal Protocol Buffers definition for the Agent Substrate Guest Data Plane.
// Exposes basic command execution (synchronous & async) and file read/write.

syntax = "proto3";

package ateenv.v1;

option go_package = "github.com/agent-substrate/env/proto/ateenv/v1;ateenvv1";

// ============================================================================
// --- SERVICES ---
// ============================================================================

// ShellService executes shell commands inside the container either synchronously
// (blocking) or asynchronously (background jobs).
service ShellService {
  // ExecuteCommand runs a command synchronously, blocking until it completes
  // and returning captured stdout, stderr, and exit code.
  rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);

  // StartCommand launches a long-running command asynchronously in the background
  // and immediately returns a unique command_id for status tracking.
  rpc StartCommand(StartCommandRequest) returns (StartCommandResponse);

  // GetCommand polls the execution status, exit code, and incremental stdout/stderr
  // logs of an asynchronous command.
  rpc GetCommand(GetCommandRequest) returns (GetCommandResponse);

  // StopCommand terminates a running asynchronous command and its child process tree.
  rpc StopCommand(StopCommandRequest) returns (StopCommandResponse);
}

// FileSystemService provides basic file reading and writing capabilities inside
// the container rootfs/workspace.
service FileSystemService {
  // ReadFile reads the full binary or text contents of a file.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile writes binary or text contents to a target file.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
}

// ============================================================================
// --- SHELL SERVICE MESSAGES ---
// ============================================================================

// Status of an asynchronous command execution.
enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  // Command is actively running in the background.
  COMMAND_STATUS_RUNNING = 1;
  // Command completed successfully with exit code 0.
  COMMAND_STATUS_COMPLETED = 2;
  // Command completed with a non-zero exit code or failed to run.
  COMMAND_STATUS_FAILED = 3;
  // Command was stopped/killed before completion.
  COMMAND_STATUS_TERMINATED = 4;
}

// Request for synchronous command execution.
message ExecuteCommandRequest {
  // Shell command line to execute (e.g. "pytest tests/", "git status").
  string command = 1;
  // Working directory inside the container (defaults to container workdir).
  string cwd = 2;
  // Environment variables to set for the executed process.
  map<string, string> env = 3;
}

// Response from synchronous command execution.
message ExecuteCommandResponse {
  // Captured standard output text.
  string stdout = 1;
  // Captured standard error text.
  string stderr = 2;
  // Process exit status code (0 indicates success).
  int32 exit_code = 3;
}

// Request to start a background asynchronous command.
message StartCommandRequest {
  // Shell command line to launch in the background.
  string command = 1;
  // Working directory inside the container.
  string cwd = 2;
  // Environment variables to set for the background process.
  map<string, string> env = 3;
}

// Response returned immediately after launching an asynchronous command.
message StartCommandResponse {
  // Unique command identifier used for polling status, reading logs, and stopping.
  string command_id = 1;
}

// Request to check status and read output of an asynchronous command.
message GetCommandRequest {
  // Identifier of the command to inspect.
  string command_id = 1;
  // Byte offset to start reading stdout from (enables incremental log polling).
  int64 stdout_offset = 2;
  // Byte offset to start reading stderr from (enables incremental log polling).
  int64 stderr_offset = 3;
}

// Response containing execution status and output logs.
message GetCommandResponse {
  // Current execution lifecycle state of the command.
  CommandStatus status = 1;
  // Process exit code (valid once status is COMPLETED or FAILED).
  int32 exit_code = 2;
  // Captured standard output text since the requested stdout_offset.
  string stdout = 3;
  // Captured standard error text since the requested stderr_offset.
  string stderr = 4;
  // Total byte size of all stdout generated by the command so far.
  int64 total_stdout_bytes = 5;
  // Total byte size of all stderr generated by the command so far.
  int64 total_stderr_bytes = 6;
}

// Request to terminate a running asynchronous command.
message StopCommandRequest {
  // Identifier of the background command to terminate.
  string command_id = 1;
}

// Response indicating whether the stop request succeeded.
message StopCommandResponse {
  // True if the command process was successfully signaled/terminated.
  bool success = 1;
}

// ============================================================================
// --- FILESYSTEM SERVICE MESSAGES ---
// ============================================================================

// Request to read a file from the container.
message ReadFileRequest {
  // Absolute or workspace-relative path of the file to read.
  string path = 1;
}

// Response containing the file data.
message ReadFileResponse {
  // Raw binary or text contents of the file.
  bytes content = 1;
}

// Request to write data to a file in the container.
message WriteFileRequest {
  // Absolute or workspace-relative path of the file to write.
  string path = 1;
  // Raw binary or text contents to write to the file.
  bytes content = 2;
}

// Response confirming the write operation.
message WriteFileResponse {
  // Number of bytes written to the file.
  int64 bytes_written = 1;
}
