// Minimal Protocol Buffers definition for the Agent Substrate Guest Data Plane.
// Exposes basic process execution (async lifecycle) and file read/write.

syntax = "proto3";

package ateenv.v1;

option go_package = "github.com/agent-substrate/env/proto/ateenv/v1;ateenvv1";

// ============================================================================
// --- SERVICES ---
// ============================================================================

// ProcessService manages the asynchronous lifecycle of processes running inside
// the container.
service ProcessService {
  // StartProcess launches a long-running process asynchronously in the background
  // and immediately returns a unique process_id for status tracking.
  rpc StartProcess(StartProcessRequest) returns (StartProcessResponse);

  // GetProcess polls the execution status, exit code, and incremental stdout/stderr
  // logs of an asynchronous process.
  rpc GetProcess(GetProcessRequest) returns (GetProcessResponse);

  // KillProcess terminates a running asynchronous process and its child process tree.
  rpc KillProcess(KillProcessRequest) returns (KillProcessResponse);
}

// FileSystemService provides basic file reading and writing capabilities inside
// the container rootfs/workspace.
service FileSystemService {
  // ReadFile reads the full binary or text contents of a file.
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);

  // WriteFile writes binary or text contents to a target file with optional mode permissions.
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
}

// ============================================================================
// --- PROCESS SERVICE MESSAGES ---
// ============================================================================

// Status of an asynchronous process execution.
enum ProcessStatus {
  PROCESS_STATUS_UNSPECIFIED = 0;
  // Process is actively running in the background.
  PROCESS_STATUS_RUNNING = 1;
  // Process completed successfully with exit code 0.
  PROCESS_STATUS_COMPLETED = 2;
  // Process completed with a non-zero exit code or failed to run.
  PROCESS_STATUS_FAILED = 3;
  // Process was killed before completion.
  PROCESS_STATUS_TERMINATED = 4;
}

// Request to start a background asynchronous process.
message StartProcessRequest {
  // Command binary and arguments to execute (e.g. ["pytest", "tests/"] or ["sh", "-c", "ls -la"]).
  repeated string command = 1;
  // Working directory inside the container (defaults to container workdir).
  string cwd = 2;
  // Environment variables to set for the background process.
  map<string, string> env = 3;
}

// Response returned immediately after launching an asynchronous process.
message StartProcessResponse {
  // Unique process identifier used for polling status, reading logs, and killing.
  string process_id = 1;
}

// Request to check status and read output of an asynchronous process.
message GetProcessRequest {
  // Identifier of the process to inspect.
  string process_id = 1;
  // Byte offset to start reading stdout from (enables incremental log polling).
  int64 stdout_offset = 2;
  // Byte offset to start reading stderr from (enables incremental log polling).
  int64 stderr_offset = 3;
}

// Response containing execution status and output logs.
message GetProcessResponse {
  // Current execution lifecycle state of the process.
  ProcessStatus status = 1;
  // Process exit code (valid once status is COMPLETED, FAILED, or TERMINATED).
  int32 exit_code = 2;
  // Captured standard output text since the requested stdout_offset.
  string stdout = 3;
  // Captured standard error text since the requested stderr_offset.
  string stderr = 4;
  // Total byte size of all stdout generated by the process so far.
  int64 total_stdout_bytes = 5;
  // Total byte size of all stderr generated by the process so far.
  int64 total_stderr_bytes = 6;
}

// Request to terminate a running asynchronous process.
message KillProcessRequest {
  // Identifier of the background process to terminate.
  string process_id = 1;
}

// Response from terminating a process.
message KillProcessResponse {
  // Exit status code after process termination.
  int32 exit_code = 1;
}

// ============================================================================
// --- FILESYSTEM SERVICE MESSAGES ---
// ============================================================================

// Request to read a file from the container.
message ReadFileRequest {
  // Absolute or workspace-relative path of the file to read.
  string path = 1;
}

// Response containing the file data.
message ReadFileResponse {
  // Raw binary or text contents of the file.
  bytes content = 1;
}

// Request to write data to a file in the container.
message WriteFileRequest {
  // Absolute or workspace-relative path of the file to write.
  string path = 1;
  // Raw binary or text contents to write to the file.
  bytes content = 2;
  // Optional POSIX file mode permission (e.g. 0644 or 0755). If 0, defaults to 0644.
  uint32 mode = 3;
}

// Response confirming the write operation.
message WriteFileResponse {
  // Number of bytes written to the file.
  int64 bytes_written = 1;
}
