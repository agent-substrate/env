[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ate-env-openhands"
version = "0.1.0"
description = "OpenHands workspaces on Agent Substrate environments (ate-env), compatible with AgentSandboxWorkspace"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"  # what openhands-sdk requires
# ate-env-client is this repo's Python client (clients/python); it is not on
# PyPI yet, so install it from the checkout first: pip install ./clients/python
# openhands-sdk is pinned to the agent-server in layer/requirements.in: the SDK
# and the agent-server it talks to move together.
dependencies = [
  "ate-env-client>=0.1.0",
  "openhands-sdk==1.55.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# The examples (examples/openhands) run OpenHands' default agent and tools.
examples = ["openhands-tools==1.55.0"]
# The integration tests start a real agent-server on localhost behind a fake
# port proxy.
test = ["pytest>=8", "openhands-agent-server==1.55.0", "openhands-tools==1.55.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
ate-env-client = { path = "../../clients/python", editable = true }

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# The same rules as clients/python.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
