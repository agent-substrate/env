[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-gym-substrate"
version = "0.2.0"
description = "NeMo Gym sandbox provider backed by Agent Substrate actors (via ate-env)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# ate-env-client is this repo's Python client (clients/python); it is not on
# PyPI yet, so install it from the checkout first: pip install ./clients/python
dependencies = ["ate-env-client>=0.1.0", "grpcio>=1.83"]

[project.optional-dependencies]
# The real deployment target. Without it the package falls back to local
# structural mirrors of the nemo_gym base types (tests only).
gym = ["nemo-gym"]
test = ["pytest>=8"]

[project.entry-points."nemo_gym.sandbox_providers"]
substrate = "nemo_gym_substrate.provider:SubstrateSandboxProvider"

[tool.setuptools.packages.find]
where = ["src"]
