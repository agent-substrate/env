name: release

# Tagging vX.Y.Z publishes the three deployment images,
# and creates a GitHub release whose notes list the images.
# No binaries are built; users install sbx with `go install`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ko-build/setup-ko@v0.9

      - name: Log in to ghcr.io
        run: echo "${{ github.token }}" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish sbx-guest image
        id: guest
        run: |
          image=$(KO_DOCKER_REPO=ghcr.io/${GITHUB_REPOSITORY@L}/sbx-guest ko build --bare ./cmd/sbx-guest)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Publish sbx-api image
        id: api
        run: |
          image=$(KO_DOCKER_REPO=ghcr.io/${GITHUB_REPOSITORY@L}/sbx-api ko build --bare ./cmd/sbx-api)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # ateom-gvisor lives in the Substrate repo; build it at the commit
      # pinned in go.mod so the worker matches the client libraries.
      - name: Publish ateom-gvisor image
        id: ateom
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/agent-substrate/substrate)
          commit=${version##*-}
          git clone --filter=blob:none https://github.com/agent-substrate/substrate "$RUNNER_TEMP/substrate"
          git -C "$RUNNER_TEMP/substrate" checkout "$commit"
          cd "$RUNNER_TEMP/substrate"
          image=$(KO_DOCKER_REPO=ghcr.io/${GITHUB_REPOSITORY@L}/ateom-gvisor ko build --bare ./cmd/ateom-gvisor)
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # Create the release, or update its notes if it already exists (e.g.
      # when the release was created in the GitHub UI, whose tag push is
      # what triggered this workflow).
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Images published by this release:
          - \`${{ steps.guest.outputs.image }}\`
          - \`${{ steps.api.outputs.image }}\`
          - \`${{ steps.ateom.outputs.image }}\`

          Deploy with \`sbx deploy\`."
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
            printf '%s\n\n%s\n' "$existing" "$notes" | gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file -
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --notes "$notes"
          fi

      - name: Update README.md with image SHAs
        run: |
          python3 -c '
          import re, os
          guest = "${{ steps.guest.outputs.image }}"
          api = "${{ steps.api.outputs.image }}"
          ateom = "${{ steps.ateom.outputs.image }}"

          with open("README.md", "r") as f:
              content = f.read()

          content = re.sub(r"(--guest-image\s+)\S+", r"\1" + guest, content)
          content = re.sub(r"(--api-image\s+)\S+", r"\1" + api, content)
          content = re.sub(r"(--ateom-image\s+)\S+", r"\1" + ateom, content)

          with open("README.md", "w") as f:
              f.write(content)
          '

      - name: Create Pull Request with updated README.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="docs/update-readme-${GITHUB_REF_NAME}"
          git checkout -b "$branch"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: update deployment image digests in README for ${GITHUB_REF_NAME}"
            git push origin "$branch"
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "docs: update deployment image digests for ${GITHUB_REF_NAME}" \
              --body "Automated PR updating \`README.md\` deployment image digests following release \`${GITHUB_REF_NAME}\`."
          fi
