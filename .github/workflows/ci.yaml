# Checks for pull requests and main: the Go build, vet and tests, gofmt, the
# license headers, and the Python client's unit tests. Release publishing lives in
# release.yaml. Actions are pinned by commit SHA (version in the trailing
# comment), as the organization's workflow security scan requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or pull request supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, test and license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: make verify-gofmt
      - run: hack/verify/boilerplate.sh

  python:
    name: Python client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'clients/python[dev]'
      - run: python -m pytest clients/python/tests -q
