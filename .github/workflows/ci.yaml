# Checks for pull requests and main: the Go build, vet and tests, gofmt, the
# license headers, and the Python client's unit tests. Release publishing lives in
# release.yaml. Actions are pinned by commit SHA (version in the trailing
# comment), as the organization's workflow security scan requires.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch or pull request supersedes the running checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Go build, vet, test and license headers
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: make verify-gofmt
      - run: hack/verify/boilerplate.sh

  python:
    name: Python client and integration tests
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -e 'clients/python[dev]' -e 'integrations/nemo-gym[test]'
      - run: python -m pytest clients/python/tests -q
      - run: python -m pytest internal/benchmarking/swebench/trajectories -q
      - run: python -m pytest benchmarking/swebench -q
      - run: ruff check clients/python
      - run: python -m pytest integrations/nemo-gym/tests -q
